<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width,initial-scale=1" name="viewport" />
  <title>Nosh WebAR — Super Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #090d16;
      --bg-elevated: #0f1623;
      --panel: #131c2e;
      --panel-hover: #182338;
      --line: rgba(148, 163, 184, 0.14);
      --line-strong: rgba(148, 163, 184, 0.25);
      --ink: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #7dd3fc;
      --accent-ink: #082f49;
      --accent-soft: rgba(56, 189, 248, 0.14);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35);
      --shadow-md: 0 8px 24px -4px rgba(0, 0, 0, 0.45);
      --shadow-lg: 0 20px 40px -12px rgba(0, 0, 0, 0.6);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
    }

    body.light {
      color-scheme: light;
      --bg: #f4f7fb;
      --bg-elevated: #ffffff;
      --panel: #ffffff;
      --panel-hover: #f8fafc;
      --line: #e2e8f0;
      --line-strong: #cbd5e1;
      --ink: #0f172a;
      --muted: #64748b;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --accent-ink: #ffffff;
      --accent-soft: rgba(2, 132, 199, 0.1);
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 6px 20px -4px rgba(15, 23, 42, 0.07);
      --shadow-lg: 0 20px 40px -12px rgba(15, 23, 42, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      background: var(--bg);
      color: var(--ink);
      margin: 0;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* Layout */
    main {
      max-width: none;
      margin: 0;
      padding: 24px 32px;
      min-height: 100vh;
    }

    main:has(#dashboard:not([hidden])) {
      padding-left: 292px;
    }

    body.sidebar-closed main:has(#dashboard:not([hidden])) {
      padding-left: 32px;
    }

    main > h1 {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin: 0 0 8px;
    }

    main:has(#dashboard:not([hidden])) > h1 {
      display: none;
    }

    /* Status Toast / Global Message */
    #message {
      min-height: 20px;
      margin: 0 0 16px;
      font-size: 13px;
      font-weight: 500;
      color: var(--accent);
    }

    #message:empty {
      display: none;
    }

    /* Sidebar */
    #sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      width: 260px;
      background: var(--panel);
      border-right: 1px solid var(--line);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      z-index: 30;
    }

    body.sidebar-closed #sidebar {
      display: none;
    }

    .brand {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--ink);
      padding: 4px 12px 20px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      flex-direction: column;
    }

    .brand small {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--accent);
      margin-top: 4px;
    }

    nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }

    nav button {
      display: flex;
      align-items: center;
      width: 100%;
      text-align: left;
      background: transparent;
      color: var(--muted);
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      margin: 0;
      padding: 10px 12px;
      font-size: 13.5px;
      font-weight: 500;
      box-shadow: none;
      transition: all 0.15s ease;
    }

    nav button:hover {
      background: var(--panel-hover);
      color: var(--ink);
      filter: none;
    }

    nav button[aria-current="page"] {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
      border-color: rgba(56, 189, 248, 0.22);
    }

    body.light nav button[aria-current="page"] {
      color: var(--accent);
      border-color: rgba(2, 132, 199, 0.2);
    }

    #sidebar > .hint {
      margin-top: auto;
      padding: 12px;
      background: var(--bg);
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius-sm);
      font-size: 12px;
    }

    /* Topbar */
    #topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      gap: 12px;
      align-items: center;
      background: color-mix(in srgb, var(--bg) 85%, transparent);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      padding: 12px 0 16px;
      margin-bottom: 24px;
    }

    #view-title {
      flex: 1;
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    #nav-toggle,
    #theme-toggle,
    #logout {
      background: var(--panel);
      color: var(--ink);
      border: 1px solid var(--line-strong);
      box-shadow: var(--shadow-sm);
      font-weight: 500;
    }

    #nav-toggle:hover,
    #theme-toggle:hover {
      background: var(--panel-hover);
      filter: none;
    }

    #logout:hover {
      border-color: rgba(239, 68, 68, 0.5);
      color: #f87171;
      background: rgba(239, 68, 68, 0.08);
      filter: none;
    }

    /* Cards & Sections */
    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 24px 28px;
      margin: 0 0 20px;
      box-shadow: var(--shadow-md);
    }

    section h2 {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin: 0 0 12px;
      color: var(--ink);
    }

    section h3 {
      font-size: 15px;
      font-weight: 600;
      margin: 22px 0 8px;
      color: var(--ink);
    }

    /* Login Card */
    #login {
      max-width: 420px;
      margin: 10vh auto;
      padding: 36px 32px;
      box-shadow: var(--shadow-lg);
    }

    #login h2 {
      font-size: 22px;
      margin-bottom: 20px;
      text-align: center;
    }

    #login input {
      display: block;
      width: 100%;
    }

    #login button[type="submit"] {
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      font-size: 14px;
    }

    /* Typography & Helpers */
    small,
    .hint {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    /* Forms & Inputs */
    label {
      display: block;
      margin-top: 14px;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink);
    }

    label:has(input[type="checkbox"]) {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-right: 20px;
      cursor: pointer;
      user-select: none;
    }

    input,
    select,
    textarea {
      font-family: inherit;
      font-size: 13.5px;
      background: var(--bg) !important;
      color: var(--ink) !important;
      border: 1px solid var(--line-strong) !important;
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      margin: 6px 6px 6px 0;
      max-width: 100%;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--accent) !important;
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--accent);
      cursor: pointer;
    }

    input[type="color"] {
      width: 64px;
      height: 40px;
      padding: 3px;
      cursor: pointer;
      vertical-align: middle;
    }

    input[type="file"] {
      padding: 8px;
      font-size: 13px;
    }

    /* Buttons */
    button {
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      background: var(--accent);
      color: var(--accent-ink);
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      padding: 9px 16px;
      margin: 6px 6px 6px 0;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: all 0.15s ease;
    }

    button:hover:not(:disabled) {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Secondary / Cancel / Close Buttons */
    #settings-close,
    #payment-close,
    #cancel-branding,
    #close-subscription,
    #renew-cancel,
    #reload,
    #upload-logo,
    .selector-panel button {
      background: var(--bg);
      color: var(--ink);
      border: 1px solid var(--line-strong);
    }

    #settings-close:hover:not(:disabled),
    #payment-close:hover:not(:disabled),
    #cancel-branding:hover:not(:disabled),
    #close-subscription:hover:not(:disabled),
    #renew-cancel:hover:not(:disabled),
    #reload:hover:not(:disabled),
    #upload-logo:hover:not(:disabled),
    .selector-panel button:hover:not(:disabled) {
      background: var(--panel-hover);
      border-color: var(--accent);
    }

    .selector-panel button {
      margin: 4px 8px 4px 0;
      padding: 10px 16px;
      font-weight: 500;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
    }

    #logo-preview {
      max-width: 120px;
      max-height: 90px;
      object-fit: contain;
      background: #ffffff;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm);
      padding: 8px;
      margin-top: 10px;
    }

    /* Billing & Stat Cards */
    .billing-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
      gap: 14px;
      margin: 18px 0;
    }

    .billing-stat {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      transition: border-color 0.15s ease;
    }

    .billing-stat:hover {
      border-color: var(--line-strong);
    }

    .billing-stat small {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
    }

    .billing-stat strong {
      display: block;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--accent);
      margin-top: 6px;
    }

    /* Alerts */
    .billing-alerts {
      display: grid;
      gap: 12px;
      margin: 14px 0;
    }

    .billing-alert {
      background: var(--bg);
      border: 1px solid var(--line-strong);
      border-left-width: 4px;
      border-radius: var(--radius-md);
      padding: 14px 18px;
    }

    .billing-alert strong {
      display: inline-block;
      font-size: 15px;
      margin-right: 10px;
      margin-bottom: 4px;
    }

    .billing-alert button {
      margin-top: 10px;
      padding: 7px 14px;
      font-size: 12.5px;
    }

    .billing-alert.status-suspended {
      border-color: rgba(239, 68, 68, 0.4);
      border-left-color: #ef4444;
    }

    .billing-alert.status-grace_period,
    .billing-alert.status-expiring_soon {
      border-color: rgba(245, 158, 11, 0.4);
      border-left-color: #f59e0b;
    }

    /* Restaurant List */
    #restaurants {
      list-style: none;
      padding: 0;
      margin: 16px 0 0;
      display: grid;
      gap: 12px;
    }

    #restaurants li {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    #restaurants li:hover {
      border-color: var(--line-strong);
      box-shadow: var(--shadow-sm);
    }

    #restaurants strong {
      display: inline-block;
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
    }

    #restaurants small {
      display: inline-block;
      margin: 0 0 12px 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12.5px;
    }

    #restaurants li button {
      background: var(--panel);
      color: var(--ink);
      border: 1px solid var(--line-strong);
      padding: 7px 12px;
      font-size: 12.5px;
      margin: 4px 6px 0 0;
    }

    #restaurants li button:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }

    .restaurant-edit {
      margin: 4px;
    }

    /* Panels */
    .renew-panel {
      margin-top: 20px;
      padding: 18px 20px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-md);
      background: var(--bg);
    }

    .renew-panel h3 {
      margin-top: 0;
    }

    .payment-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
    }

    .payment-grid input,
    .payment-grid select {
      width: 100%;
    }

    /* Tables */
    .payment-table-wrap,
    section > div[style*="overflow-x:auto"] {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      margin-top: 12px;
    }

    .billing-table,
    .payment-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13.5px;
    }

    .billing-table th,
    .payment-table th {
      background: var(--bg);
      color: var(--muted);
      font-size: 11.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }

    .billing-table td,
    .payment-table td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }

    .billing-table tbody tr:last-child td,
    .payment-table tbody tr:last-child td {
      border-bottom: none;
    }

    .billing-table tbody tr:hover,
    .payment-table tbody tr:hover {
      background: var(--panel-hover);
    }

    .billing-table button {
      font-size: 12px;
      padding: 6px 12px;
      margin: 0 6px 0 0;
    }

    /* Status Pills */
    .status-pill {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid transparent;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }

    .status-active {
      background: rgba(34, 197, 94, 0.14);
      color: #4ade80;
      border-color: rgba(34, 197, 94, 0.3);
    }

    .status-expiring_soon,
    .status-grace_period {
      background: rgba(245, 158, 11, 0.14);
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.3);
    }

    .status-suspended {
      background: rgba(239, 68, 68, 0.14);
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.3);
    }

    .status-not_configured,
    .status-no_expiry,
    .status-not_started {
      background: rgba(148, 163, 184, 0.14);
      color: #cbd5e1;
      border-color: rgba(148, 163, 184, 0.25);
    }

    body.light .status-active {
      background: #dcfce7;
      color: #15803d;
      border-color: #bbf7d0;
    }

    body.light .status-expiring_soon,
    body.light .status-grace_period {
      background: #fef3c7;
      color: #b45309;
      border-color: #fde68a;
    }

    body.light .status-suspended {
      background: #fee2e2;
      color: #b91c1c;
      border-color: #fecaca;
    }

    body.light .status-not_configured,
    body.light .status-no_expiry,
    body.light .status-not_started {
      background: #f1f5f9;
      color: #475569;
      border-color: #e2e8f0;
    }

    .billing-warning { color: #fbbf24; }
    .billing-ok { color: #4ade80; }

    /* Visibility Utilities (Critical for JS) */
    #subscription-section[hidden],
    #branding-section[hidden],
    #dashboard[hidden],
    #login[hidden],
    .renew-panel[hidden],
    #payment-section[hidden],
    [hidden],
    .view-hidden {
      display: none !important;
    }

    /* Responsive */
    @media (max-width: 760px) {
      main,
      main:has(#dashboard:not([hidden])),
      body.sidebar-closed main,
      body.sidebar-closed main:has(#dashboard:not([hidden])) {
        padding: 16px;
      }

      #sidebar {
        position: static;
        width: auto;
        border-right: none;
        border-bottom: 1px solid var(--line);
        border-radius: var(--radius-md);
        margin-bottom: 16px;
      }

      nav {
        flex-direction: row;
        flex-wrap: wrap;
      }

      nav button {
        width: auto;
      }

      #topbar {
        flex-wrap: wrap;
      }

      section {
        padding: 18px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Nosh WebAR · Super Admin</h1>
    <p id="message" role="status"></p>

    <section id="login">
      <h2>Sign in</h2>
      <form id="login-form">
        <label>Email <input autocomplete="username" id="email" required="" type="email" /></label>
        <label>Password <input autocomplete="current-password" id="password" required="" type="password" /></label>
        <button type="submit">Sign in</button>
      </form>
    </section>

    <div hidden="" id="dashboard">
      <aside id="sidebar">
        <div class="brand">◈ Nosh WebAR <small>SUPER ADMIN</small></div>
        <nav>
          <button data-nav="dashboard" type="button">Overview</button>
          <button data-nav="restaurants" type="button">Restaurants</button>
          <button data-nav="settings" type="button">Restaurant settings</button>
          <button data-nav="branding" type="button">Themes &amp; branding</button>
          <button data-nav="subscriptions" type="button">Subscriptions</button>
          <button data-nav="payments" type="button">Payments</button>
          <button data-nav="menu" type="button">Menu management</button>
        </nav>
        <p class="hint">Kitchen staff &amp; analytics — upcoming</p>
      </aside>

      <header id="topbar">
        <button aria-label="Toggle sidebar" id="nav-toggle" type="button">☰</button>
        <h2 id="view-title">Overview</h2>
        <button id="theme-toggle" type="button">Light / dark</button>
        <button id="logout">Sign out</button>
      </header>

      <section class="selector-panel" data-view="menu">
        <h2>Select restaurant</h2>
        <div data-picker="menu"></div>
      </section>

      <section class="selector-panel" data-view="subscriptions">
        <h2>Select restaurant</h2>
