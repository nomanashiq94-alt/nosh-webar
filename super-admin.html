<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nosh WebAR — Super Admin</title>
<style>
body{font:16px system-ui;background:#101318;color:#f3f4f6;margin:0}main{max-width:920px;margin:40px auto;padding:20px}section{background:#1c222b;border:1px solid #343d49;border-radius:16px;padding:22px;margin:18px 0}input,button,select{font:inherit;padding:12px;border-radius:9px;margin:5px 4px 5px 0}input,select{background:#111827;border:1px solid #596273;color:white;max-width:95%}button{background:#fbbf24;border:0;cursor:pointer;font-weight:700}button:disabled{opacity:.5}a{color:#fbbf24}#message{min-height:24px}li{padding:12px;border-bottom:1px solid #343d49}small{color:#b9c1ce}label{display:block;margin-top:10px}input[type=color]{width:72px;height:46px;padding:4px;vertical-align:middle}#logo-preview{max-width:120px;max-height:90px;object-fit:contain;background:#fff;border-radius:8px;padding:6px}#branding-section[hidden],#dashboard[hidden],#login[hidden]{display:none} .hint{color:#b9c1ce;font-size:13px} .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center} .restaurant-edit{margin-left:12px;padding:8px 12px} #branding-status{min-height:20px}</style></head>
<body><main><h1>Nosh WebAR · Super Admin</h1><p id="message" role="status"></p><section id="login"><h2>Sign in</h2><form id="login-form"><label>Email <input id="email" type="email" required autocomplete="username"></label><label>Password <input id="password" type="password" required autocomplete="current-password"></label><button type="submit">Sign in</button></form></section>
<div id="dashboard" hidden><button id="logout">Sign out</button><section><h2>Add restaurant</h2><form id="create-form"><label>Restaurant name <input id="name" maxlength="120" required placeholder="Pizza Hub"></label><label>URL slug <input id="slug" maxlength="60" required pattern="[a-z0-9]+(-[a-z0-9]+)*" placeholder="pizza-hub"></label><button type="submit">Create restaurant</button></form><small>New restaurant starts with an empty menu. Kitchen accounts are configured separately.</small></section>
<section><h2>Restaurants</h2><button id="reload" type="button">Refresh list</button><ul id="restaurants"></ul></section>
<section id="branding-section" hidden><h2>Edit restaurant branding</h2><p id="selected-restaurant"></p><form id="branding-form"><label>Restaurant name <input id="brand-name" maxlength="120" required></label><div class="row"><label>Primary color <input id="brand-primary" type="color" value="#f59e0b"></label><label>Secondary color <input id="brand-secondary" type="color" value="#fbbf24"></label></div><label>Logo URL (HTTPS) <input id="brand-logo" type="url" placeholder="https://example.com/logo.png" style="width:min(100%,520px)"></label><p class="hint">Optional: paste an HTTPS image URL, or upload a logo directly below.</p><label>Upload logo (JPG, PNG or WebP, max 2 MB) <input id="brand-logo-file" type="file" accept="image/jpeg,image/png,image/webp"></label><button id="upload-logo" type="button">Upload logo &amp; save URL</button><p id="logo-upload-status" role="status" class="hint"></p><img id="logo-preview" alt="Restaurant logo preview" hidden><p id="branding-status" role="status"></p><button id="save-branding" type="submit">Save branding</button><button id="cancel-branding" type="button">Close</button></form></section>
</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="nosh-cloud.js"></script><script src="super-admin.js"></script></body></html>
