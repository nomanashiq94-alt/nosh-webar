<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restaurant Owner | NOSH</title><link rel="stylesheet" href="owner.css?v=61-display"></head><body><main><header><div class="brand"><img id="logo" hidden alt="Restaurant logo"><div><small>RESTAURANT INTELLIGENCE</small><h1 id="brand">Owner Portal</h1></div></div><select id="theme" aria-label="Display mode"><option value="restaurant">Restaurant theme</option><option value="light">Light mode</option><option value="dark">Dark mode</option></select><button id="logout" hidden>Sign out</button></header><p id="message" role="status" aria-live="polite">Restoring workspace…</p><section id="login" class="panel login" hidden><h2>Welcome back</h2><p>Sign in to your restaurant dashboard.</p><form id="loginForm"><label>Username<input id="username" autocomplete="username" required pattern="[A-Za-z0-9_]{3,30}"></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><label class="inline"><input id="show" type="checkbox"> Show password</label><button class="primary" id="signIn">Sign in</button></form></section><section id="dashboard" hidden><p id="welcome"></p><p id="connection" role="status" hidden></p><div class="panel filters"><label>Period<select id="period"><option value="year">This year</option><option value="today">Today</option><option value="yesterday">Yesterday</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option><option value="month">This month</option><option value="lastmonth">Last month</option><option value="custom">Custom dates</option></select></label><label>From<input type="date" id="start"></label><label>To<input type="date" id="end"></label><button id="refresh">Refresh</button><button id="export" disabled>Export CSV</button></div><nav id="tabs" aria-label="Reports"><button data-tab="0" aria-pressed="true">Overview</button><button data-tab="1" aria-pressed="false">Sales</button><button data-tab="2" aria-pressed="false">Dishes</button><button data-tab="3" aria-pressed="false">Activity</button></nav><p id="range"></p><div id="report" aria-live="polite"></div><footer>Pakistan time · Reports use order creation dates and current order status. Served value is not verified payment or net profit.</footer></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="owner.js?v=62-session"></script></body></html>
