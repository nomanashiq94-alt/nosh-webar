<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Kitchen Display System (KDS)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .admin-input { width:100%; padding:8px; border-radius:10px; background:#1e293b; border:1px solid #475569; color:white; }
  </style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="nosh-cloud.js"></script>
</head>
<body class="min-h-screen bg-slate-950 p-6">
  <div class="max-w-6xl mx-auto space-y-6">
    <!-- KDS Header -->
    <div class="flex justify-between items-center border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-2xl font-bold text-amber-400 flex items-center gap-2">
          <i class="fa-solid fa-utensils"></i> Live Kitchen Display System
        </h1>
        <p class="text-xs text-slate-400 mt-1">Real-Time Active Orders Dashboard</p>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="refreshOrders()" class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-xl text-xs font-semibold">
          <i class="fa-solid fa-rotate-right"></i> Refresh
        </button>
        <button onclick="clearOrders()" class="bg-red-900/40 hover:bg-red-900/60 border border-red-500/30 text-red-200 px-4 py-2 rounded-xl text-xs">
          Archive Finished
        </button>
      </div>
    </div>

    <p id="connection" role="status" class="text-sm text-amber-300">Connecting…</p>
    <form id="login" class="max-w-md space-y-3 hidden">
      <h2 class="font-bold">Kitchen staff login</h2>
      <input id="email" type="email" autocomplete="username" required class="admin-input" placeholder="Staff email">
      <input id="password" type="password" autocomplete="current-password" required class="admin-input" placeholder="Password">
      <button class="bg-amber-500 text-black p-3 rounded-xl" type="submit">Sign in</button>
    </form>
    <button id="logout" class="hidden text-sm underline">Sign out</button>
    <!-- Live Stats -->
    <div id="kitchen-stats" class="text-sm font-semibold text-amber-300"></div>

    <!-- Active Orders Grid -->
    <div id="kitchen-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  </div>

  <script src="kitchen.js"></script>
</body>
</html>
