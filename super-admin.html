<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nosh WebAR — Super Admin</title><style>body{font:16px system-ui;background:#101318;color:#f3f4f6;margin:0}main{max-width:920px;margin:40px auto;padding:20px}section{background:#1c222b;border:1px solid #343d49;border-radius:16px;padding:22px;margin:18px 0}input,button{font:inherit;padding:12px;border-radius:9px;margin:5px 4px 5px 0}input{background:#111827;border:1px solid #596273;color:white;max-width:95%}button{background:#fbbf24;border:0;cursor:pointer;font-weight:700}button:disabled{opacity:.5}a{color:#fbbf24}#message{min-height:24px}li{padding:12px;border-bottom:1px solid #343d49}small{color:#b9c1ce}label{display:block;margin-top:10px}</style></head><body><main><h1>Nosh WebAR · Super Admin</h1><p id="message" role="status"></p><section id="login"><h2>Sign in</h2><form id="login-form"><label>Email <input id="email" type="email" required autocomplete="username"></label><label>Password <input id="password" type="password" required autocomplete="current-password"></label><button type="submit">Sign in</button></form></section><div id="dashboard" hidden><button id="logout">Sign out</button><section><h2>Add restaurant</h2><form id="create-form"><label>Restaurant name <input id="name" maxlength="120" required placeholder="Pizza Hub"></label><label>URL slug <input id="slug" maxlength="60" required pattern="[a-z0-9]+(-[a-z0-9]+)*" placeholder="pizza-hub"></label><button type="submit">Create restaurant</button></form><small>New restaurant starts with an empty menu. Kitchen access and branding are configured in later steps.</small></section><section><h2>Restaurants</h2><button id="reload">Refresh list</button><ul id="restaurants"></ul></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="nosh-cloud.js"></script><script src="super-admin.js"></script></body></html>
