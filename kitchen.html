<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Live Kitchen Display System (KDS)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>body { font-family: 'Inter', sans-serif; } .admin-input { width:100%; padding:8px; border-radius:10px; background:#1e293b; border:1px solid #475569; color:white; }button:disabled,select:disabled{opacity:.55;cursor:not-allowed}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="nosh-cloud.js"></script>
</head>
<body class="min-h-screen bg-slate-950 p-6">
<div class="max-w-6xl mx-auto space-y-6">
<div class="flex justify-between items-center border-b border-slate-800 pb-4">
<div><h1 class="text-2xl font-bold text-amber-400 flex items-center gap-2"><i class="fa-solid fa-utensils"></i> Live Kitchen Display System</h1><p class="text-xs text-slate-400 mt-1">Real-Time Active Orders Dashboard</p></div>
<div class="flex items-center gap-3">
<button onclick="refreshOrders()" class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-xl text-xs font-semibold"><i class="fa-solid fa-rotate-right"></i> Refresh</button>
<button id="archive-finished" onclick="clearOrders()" class="bg-red-900/40 hover:bg-red-900/60 border border-red-500/30 text-red-200 px-4 py-2 rounded-xl text-xs">Archive Finished</button>
</div></div>
<p id="connection" role="status" class="text-sm text-amber-300">Connecting…</p>
<form id="login" class="max-w-md mx-auto space-y-4 hidden rounded-2xl border border-slate-700 bg-slate-900 p-6">
<h2 class="font-bold text-xl text-amber-400">Kitchen Portal</h2><p class="text-sm text-slate-400">Sign in to manage restaurant orders</p>
<label for="email" class="block text-sm">Username or email</label><input id="email" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required class="admin-input" placeholder="Username or email">
<label for="password" class="block text-sm">Password</label><div class="flex gap-2"><input id="password" type="password" autocomplete="current-password" required class="admin-input" placeholder="Password"><button id="toggle-password" type="button" aria-pressed="false" class="bg-slate-700 rounded-xl px-3">Show</button></div>
<button class="bg-amber-500 text-black p-3 rounded-xl w-full font-semibold" type="submit">Sign in</button><p class="text-xs text-slate-400 text-center">Powered by Nosh WebAR</p>
</form>
<button id="logout" class="hidden text-sm underline">Sign out</button>
<div class="flex flex-wrap gap-2" role="tablist" aria-label="Kitchen order views">
<button id="tab-active" type="button" role="tab" aria-selected="true" class="bg-amber-500 text-black px-4 py-2 rounded-xl text-sm font-semibold">Active Orders</button>
<button id="tab-history" type="button" role="tab" aria-selected="false" class="bg-slate-800 text-slate-100 px-4 py-2 rounded-xl text-sm font-semibold">Order History</button>
</div>
<section id="sound-panel" hidden class="rounded-xl border border-slate-700 bg-slate-900 p-4 space-y-3"><div class="flex flex-wrap items-center gap-3"><strong id="pending-count" role="status">Pending orders: checking…</strong><button id="sound-toggle" type="button" class="bg-amber-500 text-black px-4 py-2 rounded-xl text-sm font-bold">Enable Sound</button><button id="sound-test" type="button" class="bg-slate-700 px-4 py-2 rounded-xl text-sm">Test Sound</button></div><p id="sound-status" role="status" class="text-xs text-slate-400">Enable sound after opening this page.</p></section>
<div id="kitchen-stats" class="text-sm font-semibold text-amber-300"></div>
<div id="kitchen-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
</div><script src="kitchen.js?v=55.4.8c"></script>
</body></html>
